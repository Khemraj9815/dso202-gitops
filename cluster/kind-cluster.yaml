# =============================================================================
# File        : cluster/kind-cluster.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit I 1.3 (cluster setup) - copied from Practical 1
# Apply with  : kind create cluster --name dso202-gitops --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-gitops
# Purpose     : The local cluster that Argo CD runs in. Changes from Practical 1:
#               - name 'dso202-gitops' (context: kind-dso202-gitops)
#               - one worker instead of two, to leave memory for the seven
#                 Argo CD Pods and two copies of the Task Tracker (section 3.3)
#               - host port 30090 mapped for the dev backend NodePort: the
#                 frontend's JavaScript runs in the browser and calls the
#                 backend directly (BACKEND_URL), so the browser must reach it
#               - ports 80/443 removed: no ingress controller is installed (C9)
#               Staging NodePorts (30081, 30091) are deliberately NOT mapped;
#               staging is reached with 'kubectl port-forward'.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202-gitops

networking:
  # API server on loopback only; binding to all interfaces would expose it.
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  # Control-plane node. NodePorts open on every node, so mapping them here is
  # enough. The image is pinned by digest (Practical 1), never a floating tag.
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
    extraPortMappings:
      # dev frontend: http://localhost:30080 (environments/dev/values.yaml)
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # dev backend API, called by the browser: http://localhost:30090
      - containerPort: 30090
        hostPort: 30090
        listenAddress: "127.0.0.1"
        protocol: TCP

  # Worker node: runs the application Pods.
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"
