# =============================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3.1 (per-environment config)
# Purpose     : Everything that differs in dev, and nothing else. Read by
#               argocd/applications/tasktracker-dev.yaml from branch main.
#               A release is a change to an image tag in this file (Task 7).
# =============================================================================
existingSecret: tasktracker-credentials    # C3 - created from the dev SealedSecret

database:
  image:
    tag: "1.0"

backend:
  replicaCount: 1
  image:
    tag: "1.0"
  # Reachable from the browser at http://localhost:30090 (mapped by kind).
  service:
    type: NodePort
    nodePort: 30090

frontend:
  replicaCount: 1
  image:
    tag: "1.0"
  env:
    BACKEND_URL: http://localhost:30090
  service:
    nodePort: 30080                        # C10 - http://localhost:30080
