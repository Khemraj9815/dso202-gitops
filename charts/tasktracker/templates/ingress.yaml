{{- /*
=============================================================================
File        : charts/tasktracker/templates/ingress.yaml
Assignment  : DSO202 Assignment 4
Descriptor  : Unit II 2.4 - Ingress (from Assignment 3)
Purpose     : Optional Ingress for the frontend. Disabled by default (C9): no
              ingress controller is installed in this assignment, and Ingress
              is not in the dso202 project whitelist.
=============================================================================
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  name: http
{{- end }}
